name: Smoke test
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display and software GL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers libvulkan1 > /dev/null; glxinfo -B 2>&1 | head -5 || true
      - name: Run client for a while
        run: |
          chmod +x ./gradlew
          mkdir -p run && echo "onboardAccessibility:false" > run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClient --stacktrace > /tmp/client.log 2>&1 || true
          tail -c 200000 /tmp/client.log > /tmp/client-tail.log
      - name: Push logs
        run: |
          mkdir -p /tmp/out && cp /tmp/client-tail.log /tmp/out/ && cp run/logs/latest.log /tmp/out/ 2>/dev/null || true
          cp -r run/crash-reports /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rf -q . ; git clean -fdx -q
          cp -r /tmp/out/* .
          git add -A && git commit -q -m smoke && git push -f origin probe-out
