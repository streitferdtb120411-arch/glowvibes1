name: Probe sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile Minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --stacktrace
      - name: Collect selected sources
        run: |
          J=$(find ~/.gradle "$PWD/.gradle" -name "*-sources.jar" 2>/dev/null | grep -i minecraft | head -5); echo "$J"
          mkdir -p /tmp/src && cd /tmp/src
          for j in $J; do unzip -q -o "$j" || true; done
          mkdir -p /tmp/pick
          for p in GameRenderer SubmitNodeStorage SubmitNodeCollector OrderedSubmitNodeCollector LevelRenderState CameraRenderState PlayerRenderState Screen; do
            find /tmp/src -name "$p.java" -exec cp --parents {} /tmp/pick \; ; done
          find /tmp/src -path "*client/renderer*" -iname "*fog*.java" -exec cp --parents {} /tmp/pick \;
          find /tmp/src -path "*client/renderer*" -iname "*sky*.java" -exec cp --parents {} /tmp/pick \;
          find /tmp/src -iname "*blur*.java" -exec cp --parents {} /tmp/pick \;
          find /tmp/pick -name "*.java" | head -100
      - name: Push to probe-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rf -q . ; git clean -fdx -q
          cp -r /tmp/pick/tmp/src/* . 2>/dev/null || cp -r /tmp/pick/* .
          git add -A && git commit -q -m probe && git push -f origin probe-out
